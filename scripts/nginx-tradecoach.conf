# Install on VPS:
#   bash scripts/install-nginx.sh
# Or manually:
#   sudo cp scripts/nginx-tradecoach.conf /etc/nginx/sites-available/tradecoach
#   sudo ln -sf /etc/nginx/sites-available/tradecoach /etc/nginx/sites-enabled/tradecoach
#   sudo nginx -t && sudo systemctl reload nginx
#
# Routing:
#   tradecoachai.org      → Next.js  127.0.0.1:3000  (all paths, including /api/*)
#   api.tradecoachai.org   → FastAPI  127.0.0.1:8000
#
# Do NOT proxy /api/sync/ on the app domain to FastAPI — the web UI uses Next.js
# routes (/api/sync/devices, /api/sync/pairing-code, /api/sync/broker-status).
# The Chrome extension talks to api.tradecoachai.org for sync events.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream tradecoach_nextjs {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

upstream tradecoach_api {
    server 127.0.0.1:8000 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

# --- App: HTTP → HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name tradecoachai.org www.tradecoachai.org;

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- API: HTTP → HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name api.tradecoachai.org;

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- App: Next.js ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tradecoachai.org www.tradecoachai.org;

    # Certbot usually adds these — adjust paths if yours differ
    ssl_certificate /etc/letsencrypt/live/tradecoachai.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tradecoachai.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25m;

    location / {
        proxy_pass http://tradecoach_nextjs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

# --- API: FastAPI (extension sync) ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.tradecoachai.org;

    ssl_certificate /etc/letsencrypt/live/api.tradecoachai.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.tradecoachai.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25m;

    location / {
        proxy_pass http://tradecoach_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
