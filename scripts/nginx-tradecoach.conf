# TradeCoach-only nginx site. Does NOT modify vip2025.live or other vhosts.
#
# Ports 3001 (Next.js) and 8001 (FastAPI) are dedicated to TradeCoach so they
# never conflict with other apps on this VPS.
#
# Install:
#   sudo cp scripts/nginx-tradecoach.conf /etc/nginx/sites-available/tradecoach
#   sudo ln -sf /etc/nginx/sites-available/tradecoach /etc/nginx/sites-enabled/tradecoach
#   sudo nginx -t && sudo systemctl reload nginx

upstream tradecoach_nextjs {
    server 127.0.0.1:3001 max_fails=2 fail_timeout=5s;
    keepalive 16;
}

upstream tradecoach_api {
    server 127.0.0.1:8001 max_fails=2 fail_timeout=5s;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name tradecoachai.org www.tradecoachai.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tradecoachai.org www.tradecoachai.org;

    ssl_certificate /etc/letsencrypt/live/tradecoachai.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tradecoachai.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25m;

    location ~ ^/api/sync/(events|broker-session|device/status)(/|$) {
        proxy_pass http://tradecoach_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 15s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
    }

    location ~ ^/api/brokers/ {
        proxy_pass http://tradecoach_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 15s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
    }

    location / {
        proxy_pass http://tradecoach_nextjs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 15s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.tradecoachai.org;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.tradecoachai.org;

    ssl_certificate /etc/letsencrypt/live/tradecoachai.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tradecoachai.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25m;

    location / {
        proxy_pass http://tradecoach_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
    }
}
